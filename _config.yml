# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
# title 会用在：顶栏站点名、浏览器标签、og:site_name、订阅源标题
title: 桃
subtitle: '桃之夭夭 · 灼灼其华'
description: '游戏开发、编程折腾、读书笔记，以及一些还没成型的想法。'
keywords: 编程,游戏开发,Godot,教程,文学
author: 桃
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 部署在 https://taole-si.github.io/Blog/
url: https://taole-si.github.io/Blog
root: /Blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
metadata:
  generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: taole

# RSS / Atom 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

# Deployment
## GitHub Pages：main 分支放生成产物，master 分支放源文件
deploy:
  type: git
  repo: https://github.com/TaoLe-si/Blog.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# Markdown 渲染：用 markdown-it 替代默认 marked，启用 KaTeX 预渲染
# 解决 marked 把 _ 误判为斜体、吞掉 LaTeX 下标的问题
# 公式在 build 时被转成静态 HTML，文章不依赖客户端 JS / CDN
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: true
    quotes: '“”‘’'
  plugins:
    - markdown-it-katex
  anchors:
    level: 2
    collisionSuffix: ''
